services:
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: linkup-server-dev
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    env_file:
      - .env
    restart: unless-stopped

volumes:
  go-mod-cache:
  go-build-cache:
