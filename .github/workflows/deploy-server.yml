name: Deploy Server

on:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.3

      - name: Verify build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./tests/... -v

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 60s
          script_timeout: 10m
          script: |
            set -e
            cd /opt/linkup

            # Save current image as rollback candidate
            docker tag linkup-server:latest linkup-server:prev 2>/dev/null || true

            # Pull & build
            cd /opt/linkup/server
            git pull origin main
            cd /opt/linkup
            docker compose build server

            # Deploy new version
            docker compose up -d server

            # Health check (up to 60s)
            echo "Waiting for server (up to 60s)..."
            for i in $(seq 1 20); do
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "SERVER HEALTHY after ${i}x3s"
                break
              fi
              sleep 3
            done

            # Rollback on failure
            if ! curl -sf http://localhost:8080/health > /dev/null 2>&1; then
              echo "DEPLOY FAILED — rolling back to previous image..."
              docker compose down server
              docker tag linkup-server:prev linkup-server:latest 2>/dev/null || true
              docker compose up -d server
              sleep 10
              if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
                echo "ROLLBACK OK — server restored from prev image"
              else
                echo "ROLLBACK ALSO FAILED!"
              fi
              exit 1
            fi

      - name: Notify Telegram
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} <b>Server Deploy</b>
            Pusher: ${{ github.event.pusher.name }}
            Repo: <a href="${{ github.server_url }}/${{ github.repository }}">LinkUp_Server</a>
            Commit: ${{ github.event.head_commit.message || 'manual' }}
            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
